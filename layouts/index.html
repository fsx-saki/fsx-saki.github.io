{{ define "main" }}
<div class="home">
    <h1>{{ .Site.Title }}</h1>
    <p>欢迎来到我的博客！</p>
    
    <h2>最新文章</h2>
    {{ range first 5 (where .Site.RegularPages "Type" "posts") }}
    <article>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <time>{{ .Date.Format "2006-01-02" }}</time>
    </article>
    {{ end }}
</div>
{{ end }}
